[defaults]
# Use the local roles directory
roles_path = ./roles

# Inventory file location
inventory = ./inventory.ini

# Disable host key checking for easier automation
host_key_checking = False

# Enable callback plugins for better output
callbacks_enabled = profile_tasks, timer

# Use human-readable output
stdout_callback = yaml

# Increase timeout for slower connections
timeout = 30

# Keep temp files for debugging (optional)
# keep_remote_files = True

# Show diffs when files change
# show_diff = True

[privilege_escalation]
become = True
become_method = sudo
become_user = root
become_ask_pass = False

[ssh_connection]
# Use pipelining for faster execution
pipelining = True

# Control path for SSH multiplexing
control_path = %(directory)s/%%h-%%r
