---
# Example playbook for deploying n8n

- name: Deploy n8n workflow automation
  hosts: n8n_servers
  become: true

  vars:
    # Customize these variables for your environment
    n8n_version: "latest"
    n8n_port: 5678
    n8n_basic_auth_active: true
    n8n_basic_auth_user: "admin"
    n8n_basic_auth_password: "ChangeMe123!"
    n8n_timezone: "UTC"

    # Optional: Add custom environment variables
    # n8n_env_vars:
    #   N8N_ENCRYPTION_KEY: "your-encryption-key"
    #   N8N_USER_MANAGEMENT_JWT_SECRET: "your-jwt-secret"

  roles:
    - n8n

  post_tasks:
    - name: Display n8n access information
      ansible.builtin.debug:
        msg:
          - "n8n has been successfully deployed!"
          - "Access n8n at: http://{{ ansible_default_ipv4.address }}:{{ n8n_port }}"
          - "Username: {{ n8n_basic_auth_user }}"
          - "Password: {{ n8n_basic_auth_password }}"
          - ""
          - "IMPORTANT: Change the default password for production use!"
